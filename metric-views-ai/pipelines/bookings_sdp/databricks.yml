# Databricks Asset Bundle — HTG bookings medallion pipeline
# A production-ready Spark Declarative Pipeline (Auto Loader → Bronze → Silver → Gold)
# that mirrors notebooks 00–02 but keeps every layer incrementally in sync.
#
# Deploy/run (choose your profile from `databricks auth profiles`):
#   databricks bundle validate --profile <PROFILE>
#   databricks bundle deploy   --profile <PROFILE>            # dev target (default)
#   databricks bundle run bookings_sdp --profile <PROFILE>
#
# Prereq: run notebook 00_setup (sections 1–3) once so the Volume + landing/ JSON files exist.
bundle:
  name: htg_bookings_sdp

variables:
  catalog:
    description: Unity Catalog to publish into (on Free Edition this is usually `workspace`).
    default: workspace
  target_schema:
    description: Schema for the pipeline's medallion tables. Use a FRESH schema so it does not collide with the batch tables from notebooks 00–02.
    default: htg_metric_views_lab_prod
  landing_path:
    description: Volume folder Auto Loader watches for new booking JSON files (filled by notebook 00).
    default: /Volumes/workspace/htg_metric_views_lab/raw_files/landing

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
